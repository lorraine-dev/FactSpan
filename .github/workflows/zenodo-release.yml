name: Publish dataset to Zenodo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish to Zenodo"
        required: true
      dry_run:
        description: "Prepare the Zenodo draft but don't publish"
        type: boolean
        default: false

jobs:
  zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,body,publishedAt > release.json
          echo "tag=$(jq -r .tagName release.json)" >> "$GITHUB_OUTPUT"
          echo "published_at=$(jq -r .publishedAt release.json)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<ZENODO_RELEASE_BODY_EOF'
            jq -r .body release.json
            echo 'ZENODO_RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Use dataset files from the release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --depth 1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout "$RELEASE_TAG" -- Data/FactSpan.csv Data/FactSpan_annotated.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          RELEASE_DATE: ${{ steps.release.outputs.published_at }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--record-id 15084388
                --version "$RELEASE_TAG"
                --description "$RELEASE_BODY"
                --publication-date "$RELEASE_DATE")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/release/publish_to_zenodo.py "${ARGS[@]}" \
            Data/FactSpan.csv Data/FactSpan_annotated.csv
